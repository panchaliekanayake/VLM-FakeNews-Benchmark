[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litevlm-fakenews-benchmark"
version = "1.0.0"
description = "Reproducible evaluation of lightweight vision-language models for multimodal fake-news classification"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Panchali Ekanayake"},
  {name = "Damayanthi Herath"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
inference = [
  "numpy>=1.24,<3",
  "Pillow>=9.5",
  "torch>=2.1",
  "transformers>=4.37,<5",
  "accelerate>=0.25",
]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
litevlm-fnd = "litevlm_fakenews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
